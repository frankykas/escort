<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Cleopatra</title>
    <style>
      :root { color-scheme: light; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(circle at 30% 20%, #fff5fa 0%, #fdeef7 35%, #f6e8ff 70%, #ecf5ff 100%);
        color: #334155;
      }
      .wrap {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100%; padding: 24px; text-align: center;
      }
      .mark {
        font-size: 28px; font-weight: 800; letter-spacing: -0.02em;
        background: linear-gradient(90deg, rgb(246,51,154), rgb(56,189,248));
        -webkit-background-clip: text; background-clip: text; color: transparent;
        margin-bottom: 18px;
      }
      .msg { font-size: 14px; color: #64748b; }
      .spinner {
        margin-top: 22px;
        width: 28px; height: 28px;
        border: 2.5px solid rgba(246,51,154,0.18);
        border-top-color: rgb(246,51,154);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">Cleopatra</div>
      <div class="msg">Loading…</div>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </body>
</html>
